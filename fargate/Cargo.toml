[package]
name = "kaggle-s3-uploader"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }

# AWS SDK
aws-config = "1.1"
aws-sdk-ssm = "1.13"
aws-sdk-s3 = "1.15"

# HTTP client
reqwest = { version = "0.11", features = ["stream", "json"] }

# Error handling
anyhow = "1.0"

# Streaming utilities
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.5"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# File operations
walkdir = "2.4"
tempfile = "3.8"

# Archive handling
zip = "0.6"

# Retry logic
tokio-retry = "0.3"

[dev-dependencies]
proptest = "1.4"
mockall = "0.12"
wiremock = "0.5"

[profile.release]
strip = true          # Strip symbols to reduce binary size
lto = true            # Link-time optimization
codegen-units = 1     # Maximum optimization (slower compilation)
opt-level = "z"       # Optimize for size
